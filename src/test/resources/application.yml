spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:user_db}
    username: ${DB_USERNAME:test_user_name}
    password: ${DB_PASSWORD:test_user_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate.ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_SECRET_PASSWORD:redis_test_password}
      entity-ttl: 60

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
    enabled: true

  config:
    import: optional:file:.env[.properties]

crypto:
  card-secret-key: "${CARD_SECRET_KEY:hfdgchtxbfjvyubjvdsfsdgfdfhgjegj}"
