spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_SECRET_PASSWORD}
      entity-ttl: 60

  jpa:
    show-sql: ${SHOW_SQL:false}
