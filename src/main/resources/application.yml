spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate.ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
    enabled: true

  config:
    import: optional:file:.env[.properties]

crypto:
  card-secret-key: "${CARD_SECRET_KEY}"
